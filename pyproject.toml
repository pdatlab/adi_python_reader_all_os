[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adi-reader-all-os"
version = "0.1.0"
description = "Read LabChart (.adicht/.adidat) files on any OS, without the ADInstruments SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cffi>=1.15", "numpy>=1.20"]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
]

[project.optional-dependencies]
table = ["pandas>=1.0"]  # get_comments(return_as="table"), get_comment_pairs

[project.urls]
Homepage = "https://github.com/pdatlab/adi_python_reader_all_os"

[tool.setuptools]
packages = ["adic"]

[tool.setuptools.package-data]
# the compiled extension, one per Python version (built by build_all_pyds.py)
adic = ["_adic_cffi*.pyd", "_adic_cffi*.so"]
